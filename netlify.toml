[build]
  command = "npm install --legacy-peer-deps && npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  # Host serving /registry/graphql and /candles/graphql. Every subgraph URL in
  # src/config/subgraphEndpoints.js derives from it, and usePoolData falls back
  # to it, so this is the single knob for the backend. Deploy-preview and
  # branch-deploy contexts inherit this block unless they override it.
  NEXT_PUBLIC_FUTARCHY_API_URL = "https://seer-futarchy-api.netlify.app"

  # NEXT_PUBLIC_POOL_API_URL is deliberately unset: usePoolData falls back to
  # the host above, so setting it here would silently pin that one caller to a
  # different backend — which is exactly what happened while it still read
  # api.futarchy.fi.

  # Legacy TickSpread REST (/v3/conditional, /v3/single_proposal). Those routes
  # exist on no current backend, so this stays pointed at the old host rather
  # than pretending the new one serves them.
  NEXT_PUBLIC_API_URL = "https://api.futarchy.fi"
  NEXT_PUBLIC_API_VERSION = "v1"
  NEXT_PUBLIC_GNOSIS_RPC_URL = "https://rpc.gnosischain.com"
  NEXT_PUBLIC_SUPABASE_URL = "https://nvhqdqtlsdboctqjcelq.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im52aHFkcXRsc2Rib2N0cWpjZWxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDIxNDU3ODEsImV4cCI6MjA1NzcyMTc4MX0.6kjpxGVqSQNMz3DqycuNPv_ug8sdBNKeJsN0Z3X7oLg"
  NEXT_PUBLIC_DATA_SOURCE = "supabase"
  NEXT_PUBLIC_DEBUG_MODE = "false"
  NEXT_PUBLIC_USE_DEFAULT_MOCK_METADATA = "true"
  NEXT_PUBLIC_USE_MOCK_SNAPSHOT = "false"

# Deploy previews on PRs
[context.deploy-preview]
  command = "npm install --legacy-peer-deps && npm run build"

# Branch deploys
[context.branch-deploy]
  command = "npm install --legacy-peer-deps && npm run build"

# The first GIP-153 deployment had empty pools at a stale opening price and was
# archived. Keep old bookmarks from landing on a dead market after its static
# page is removed from src/config/markets.js.
[[redirects]]
  from = "/markets/0x1d1f3b43f3c61b815041e9092b1ba7ca37c63262"
  to = "/markets/0x4120de9931fd29c8a6effea4df57a7c8760c1677"
  status = 301
  force = true

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
