name: auto-qa live

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: 'API base URL for live checks (default: the app''s DEFAULT_API_BASE)'
        required: false
        default: ''
  schedule:
    - cron: '17 4 * * 1'

jobs:
  live:
    name: Live endpoint auto-qa
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run live auto-qa tests
        env:
          AUTO_QA_API_BASE: ${{ inputs.api_base }}
        run: npm run auto-qa:test:live
